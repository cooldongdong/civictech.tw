name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          PUBLIC_GOOGLE_SHEET_CSV_URL: ${{ secrets.PUBLIC_GOOGLE_SHEET_CSV_URL }}
          PUBLIC_GOOGLE_FORM_ACTION_URL: ${{ secrets.PUBLIC_GOOGLE_FORM_ACTION_URL }}
          PUBLIC_ENTRY_TITLE: ${{ secrets.PUBLIC_ENTRY_TITLE }}
          PUBLIC_ENTRY_DESCRIPTION: ${{ secrets.PUBLIC_ENTRY_DESCRIPTION }}
          PUBLIC_ENTRY_PAINPOINT: ${{ secrets.PUBLIC_ENTRY_PAINPOINT }}
          PUBLIC_ENTRY_SUPERPOWER: ${{ secrets.PUBLIC_ENTRY_SUPERPOWER }}
          PUBLIC_ENTRY_PROGRESS: ${{ secrets.PUBLIC_ENTRY_PROGRESS }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
